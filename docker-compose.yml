services:
  # Миграции БД
  migrations:
    build:
      context: .
      dockerfile: alembic/Dockerfile
    command: >
      sh -c "
      python alembic/wait_db.py &&
      echo 'start migration' &&
      alembic upgrade head
      "
    env_file:
      - .env
    volumes:
      - ./alembic:/alembic/alembic
      - ./common:/alembic/common
    depends_on:
      - postgres

  # API-сервис
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./common:/app/common
    depends_on:
      minio:
        condition: service_healthy
      worker-recognize:
        condition: service_started

  outbox:
    build:
      context: .
      dockerfile: app/Dockerfile
    command: python -m app.infrastructure.worker
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  # Сервис распознавания аудиовизуальных данных
  worker-recognize:
    build:
      context: .
      dockerfile: recognize_worker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./recognize_worker:/worker/recognize_worker
      - ./common:/worker/common
      - ./tmp_data:/worker/tmp
    runtime: nvidia
    depends_on:
       postgres:
         condition: service_healthy
       rabbitmq:
        condition: service_healthy
       minio:
        condition: service_healthy

  # Сервис генерации протокола
  worker-llm:
    build:
      context: .
      dockerfile: llm_worker/Dockerfile
    env_file:
      - .env-worker
      - .env-ollama
    volumes:
      - ./llm_worker:/worker/llm_worker
      - ./common:/worker/common
      - ./tmp_data:/worker/tmp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Реляционная БД
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: stt_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bugaggga.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Брокер сообщений
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend        # папка с клонированным фронтендом
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""    # пустая строка → nginx proxies /api/*
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - api

  # Локальные LLM через Ollama
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    #runtime: nvidia
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    entrypoint: >
      sh -c "
        echo 'Pulling $$OLLAMA_MODEL_TEXT...' &&
        ollama pull $$OLLAMA_MODEL_TEXT &&
        echo 'Pulling $$OLLAMA_MODEL_VISION...' &&
        ollama pull $$OLLAMA_MODEL_VISION &&
        echo 'Models ready'
      "
    env_file:
      - .env-ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  # S3-Хранилище
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web-консоль
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/generate-protocol &&
        mc anonymous set none local/generate-protocol &&
        echo 'Bucket ready'
      "
    restart: "no"

volumes:
  ollama_data:
  minio_data: