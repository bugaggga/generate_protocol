services:
  migrations:
    build:
      context: .
      dockerfile: alembic/Dockerfile
    command: >
      sh -c "
      python alembic/wait_db.py &&
      echo 'start migration' &&
      alembic upgrade head
      "
    env_file:
      - .env
    volumes:
      - ./alembic:/alembic/alembic
      - ./common:/alembic/common
    depends_on:
      - postgres

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "80:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./common:/app/common
    depends_on:
      - rabbitmq
      - postgres
      - migrations

  worker-stt:
    build:
      context: .
      dockerfile: recognize_worker/Dockerfile
    env_file:
      - .env
    volumes:
      - ./recognize_worker:/worker/recognize_worker
      - ./common:/worker/common
      - ./tmp_data:/worker/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
       postgres:
         condition: service_healthy
       rabbitmq:
        condition: service_healthy

  worker-llm:
    build:
      context: .
      dockerfile: llm_worker/Dockerfile
    env_file:
      - .env-worker
    volumes:
      - ./llm_worker:/worker/llm_worker
      - ./common:/worker/common
      - ./tmp_data:/worker/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: stt_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bugaggga.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5